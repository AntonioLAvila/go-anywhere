[project]
name = "go-anywhere"
version = "0.1.0"
description = "Near-arbitrary locomotion for the Unitree Go2 on mjlab: skill experts, DAgger distillation, RL finetune."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "pyyaml>=6.0",
    # rsl-rl-lib 5.4.2 (pinned by mjlab) passes start_method to wandb.Settings,
    # which wandb removed in 0.29.0. Lift when mjlab moves to rsl-rl-lib>=5.5.
    "wandb>=0.22.3,<0.29",
]

[project.entry-points."mjlab.tasks"]
go_anywhere = "go_anywhere.tasks"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go_anywhere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and the MuJoCo-Warp simulator"]
# ROS pytest plugins (if a ROS env is sourced) are disabled: they need extra deps.
addopts = "-m 'not gpu' -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint -p no:ament_flake8 -p no:ament_copyright"

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E111", "E114", "E117", "E501"]

[tool.pyright]
include = ["go_anywhere", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
